<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BESing Manager Popup</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      width: 320px;
      background: #090d16;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .logo-badge {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #6366f1, #3b82f6);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
    }
    .ver {
      font-size: 10px;
      color: #818cf8;
      background: rgba(99, 102, 241, 0.15);
      padding: 1px 6px;
      border-radius: 4px;
      margin-left: 6px;
    }
    .card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .status-label { color: #94a3b8; }
    .status-val { font-weight: 600; color: #10b981; }
    .status-val.blocked { color: #ef4444; }
    .btn {
      width: 100%;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 9px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn:hover {
      background: linear-gradient(135deg, #818cf8, #6366f1);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-badge">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
    </div>
    <div>
      <span class="title">BESing Extension</span>
      <span class="ver">v1.0.0</span>
    </div>
  </div>

  <div class="card">
    <div class="status-row">
      <span class="status-label">Current Domain:</span>
      <span class="status-val" id="domain-val" style="color:#e2e8f0;font-family:monospace;">loading...</span>
    </div>
    <div class="status-row">
      <span class="status-label">Site Status:</span>
      <span class="status-val" id="status-val">Active</span>
    </div>
    <div class="status-row" style="margin-bottom:0;">
      <span class="status-label">Total Blocked Sites:</span>
      <span class="status-val" id="blocked-count" style="color:#38bdf8;">0</span>
    </div>
  </div>

  <button class="btn" id="open-page-manager">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
    Open On-Page Manager (Alt+Shift+B)
  </button>

  <script src="popup.js"></script>
</body>
</html>
